[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-ai-daily-papers"
version = "1.0.0"
description = "AI-powered automated academic paper fetching, analysis, and archiving system"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "paperRead Contributors", email = "your-email@example.com"}
]
keywords = ["arxiv", "zotero", "academic", "papers", "ai", "llm", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiohttp>=3.9.0",
    "feedparser>=6.0.10",
    "openai>=1.12.0",
    "pyzotero>=1.5.22",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/your-username/paperRead"
Documentation = "https://github.com/your-username/paperRead/blob/main/README.md"
Repository = "https://github.com/your-username/paperRead"
"Bug Tracker" = "https://github.com/your-username/paperRead/issues"

[project.scripts]
paperread = "main:main"
paperread-index = "zotero_indexer:build_knowledge_base"

[tool.setuptools]
packages = ["."]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml"]
