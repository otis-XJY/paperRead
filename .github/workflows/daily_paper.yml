name: Zotero AI Daily Papers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-auto-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: paperread-daily
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Zotero Knowledge Base
        timeout-minutes: 30
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u zotero_indexer.py

      - name: Run AI Analysis & Push
        timeout-minutes: 100
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          WXWORK_WEBHOOK_URL: ${{ secrets.WXWORK_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_ROOT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_ROOT_NODE_TOKEN }}
          FEISHU_WIKI_DAILY_FOLDER_NAME: ${{ secrets.FEISHU_WIKI_DAILY_FOLDER_NAME || 'PaperRead' }}
          ENABLE_NOTIFICATION: "1"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py

      - name: Commit State Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch history.json knowledge_base.json state.json feishu_wiki_node_cache.json
          git add history.json knowledge_base.json state.json feishu_wiki_node_cache.json
          git commit -m "chore: update history, knowledge base and state" || echo "No changes to commit"
          git push || echo "No changes to push"
