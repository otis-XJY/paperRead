name: Daily Work Report

on:
  # schedule:
  #   # 15:30 UTC = 23:30 Asia/Shanghai (UTC+8, no DST)
  #   - cron: "30 15 * * *"
  workflow_dispatch:

jobs:
  daily-report:
    # This must be the Windows computer where ActivityWatch is running.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: daily-work-report
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ACTIVITYWATCH_URL: "http://127.0.0.1:5600"
      DAILY_REPORT_PROGRESS: "1"
      DAILY_REPORT_ACTIVITY_CLEAR_MAX_SECONDS: "30"
      # A ModelScope outage previously consumed 13 x 60-second model attempts
      # and prevented the report from reaching its send step.  Keep the LLM
      # budget below the job deadline; daily_report.py sends a fact-only
      # fallback report if this budget is exhausted.
      LLM_TIMEOUT_SECONDS: "20"
      LLM_MAX_RETRIES: "0"
      LLM_MAX_ROUNDS: "1"
      LLM_MAX_ENDPOINT_ATTEMPTS: "3"
      LLM_CALL_TIMEOUT_SECONDS: "60"
      DAILY_REPORT_FEISHU_APP_ID: ${{ secrets.DAILY_REPORT_FEISHU_APP_ID || secrets.FEISHU_APP_ID }}
      DAILY_REPORT_FEISHU_APP_SECRET: ${{ secrets.DAILY_REPORT_FEISHU_APP_SECRET || secrets.FEISHU_APP_SECRET }}
      DAILY_REPORT_FEISHU_CHAT_ID: ${{ secrets.DAILY_REPORT_FEISHU_CHAT_ID }}
      DAILY_REPORT_PAPERREAD_CHAT_ID: ${{ vars.DAILY_REPORT_PAPERREAD_CHAT_ID || secrets.DAILY_REPORT_PAPERREAD_CHAT_ID }}
      DAILY_REPORT_MAX_CHAT_MESSAGES: ${{ vars.DAILY_REPORT_MAX_CHAT_MESSAGES || '500' }}
      DAILY_REPORT_MAX_PAPERREAD_MESSAGES: ${{ vars.DAILY_REPORT_MAX_PAPERREAD_MESSAGES || '100' }}
      # Configure the watched sender in repository Variables, never in source.
      DAILY_REPORT_QUESTION_SENDER_NAME: ${{ vars.DAILY_REPORT_QUESTION_SENDER_NAME }}
      DAILY_REPORT_QUESTION_SENDER_ID: ${{ vars.DAILY_REPORT_QUESTION_SENDER_ID }}
      DAILY_REPORT_PAPERREAD_SENDER_ID: ${{ vars.DAILY_REPORT_PAPERREAD_SENDER_ID }}
      DAILY_REPORT_PAPERREAD_APP_ID: ${{ vars.DAILY_REPORT_PAPERREAD_APP_ID }}
      DAILY_REPORT_KNOWLEDGE_BASE_ENABLED: ${{ vars.DAILY_REPORT_KNOWLEDGE_BASE_ENABLED || '1' }}
      DAILY_REPORT_MAX_KNOWLEDGE_DOCUMENTS: ${{ vars.DAILY_REPORT_MAX_KNOWLEDGE_DOCUMENTS || '8' }}
      DAILY_REPORT_DOCUMENT_ACTIVITY_ENABLED: ${{ vars.DAILY_REPORT_DOCUMENT_ACTIVITY_ENABLED || '1' }}
      DAILY_REPORT_MAX_DOCUMENT_ACTIVITY: ${{ vars.DAILY_REPORT_MAX_DOCUMENT_ACTIVITY || '30' }}
      DAILY_REPORT_FEISHU_WIKI_ROOT_NODE_TOKEN: ${{ secrets.DAILY_REPORT_FEISHU_WIKI_ROOT_NODE_TOKEN }}
      DAILY_REPORT_FEISHU_USER_OPEN_ID: ${{ vars.DAILY_REPORT_FEISHU_USER_OPEN_ID }}
      # Keep the event queue outside the checkout directory; checkout cleans
      # ignored/untracked files before each run.
      DAILY_REPORT_FEISHU_EVENT_DB: ${{ vars.DAILY_REPORT_FEISHU_EVENT_DB || 'D:\\paperRead-runtime\\feishu_document_events.sqlite3' }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER_1_API_KEY: ${{ secrets.LLM_PROVIDER_1_API_KEY }}
      LLM_PROVIDER_2_API_KEY: ${{ secrets.LLM_PROVIDER_2_API_KEY }}
      LLM_PROVIDER_3_API_KEY: ${{ secrets.LLM_PROVIDER_3_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check runner Python
        shell: cmd
        run: |
          python --version

      - name: Prepare Python user directories
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\localappdata" mkdir "%RUNNER_TEMP%\localappdata"
          if not exist "%RUNNER_TEMP%\appdata" mkdir "%RUNNER_TEMP%\appdata"
          if not exist "%RUNNER_TEMP%\userprofile" mkdir "%RUNNER_TEMP%\userprofile"
          if not exist "%RUNNER_TEMP%\pip-cache" mkdir "%RUNNER_TEMP%\pip-cache"
          echo LOCALAPPDATA=%RUNNER_TEMP%\localappdata>>"%GITHUB_ENV%"
          echo APPDATA=%RUNNER_TEMP%\appdata>>"%GITHUB_ENV%"
          echo USERPROFILE=%RUNNER_TEMP%\userprofile>>"%GITHUB_ENV%"
          echo HOME=%RUNNER_TEMP%\userprofile>>"%GITHUB_ENV%"
          echo PIP_CACHE_DIR=%RUNNER_TEMP%\pip-cache>>"%GITHUB_ENV%"
          echo PIP_DISABLE_PIP_VERSION_CHECK=1>>"%GITHUB_ENV%"

      - name: Install dependencies
        shell: cmd
        run: python -m pip install -r requirements.txt

      - name: Generate and send report
        shell: cmd
        run: python -u daily_report.py
