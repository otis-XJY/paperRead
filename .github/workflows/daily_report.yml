name: Daily Work Report

on:
  schedule:
    - cron: "30 23 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  daily-report:
    # This must be the Windows computer where ActivityWatch is running.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: daily-work-report
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      REPORT_TIMEZONE: "Asia/Shanghai"
      ACTIVITYWATCH_URL: "http://127.0.0.1:5600"
      DAILY_REPORT_FEISHU_APP_ID: ${{ secrets.DAILY_REPORT_FEISHU_APP_ID }}
      DAILY_REPORT_FEISHU_APP_SECRET: ${{ secrets.DAILY_REPORT_FEISHU_APP_SECRET }}
      DAILY_REPORT_FEISHU_CHAT_ID: ${{ secrets.DAILY_REPORT_FEISHU_CHAT_ID }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check runner Python
        shell: cmd
        run: |
          python --version

      - name: Prepare Python user directories
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\localappdata" mkdir "%RUNNER_TEMP%\localappdata"
          if not exist "%RUNNER_TEMP%\appdata" mkdir "%RUNNER_TEMP%\appdata"
          if not exist "%RUNNER_TEMP%\userprofile" mkdir "%RUNNER_TEMP%\userprofile"
          if not exist "%RUNNER_TEMP%\pip-cache" mkdir "%RUNNER_TEMP%\pip-cache"
          echo LOCALAPPDATA=%RUNNER_TEMP%\localappdata>>"%GITHUB_ENV%"
          echo APPDATA=%RUNNER_TEMP%\appdata>>"%GITHUB_ENV%"
          echo USERPROFILE=%RUNNER_TEMP%\userprofile>>"%GITHUB_ENV%"
          echo HOME=%RUNNER_TEMP%\userprofile>>"%GITHUB_ENV%"
          echo PIP_CACHE_DIR=%RUNNER_TEMP%\pip-cache>>"%GITHUB_ENV%"
          echo PIP_DISABLE_PIP_VERSION_CHECK=1>>"%GITHUB_ENV%"

      - name: Install dependencies
        shell: cmd
        run: python -m pip install -r requirements.txt

      - name: Generate and send report
        shell: cmd
        run: python -u daily_report.py
